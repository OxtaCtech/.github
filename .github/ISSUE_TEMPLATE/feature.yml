name: Feature proposal
description: Propose a verified improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended outcome
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Measurable acceptance criteria
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Alternatives, risks and evidence needed
